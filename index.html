<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a14" />
<meta name="description" content="VocabLens 词镜 —— 外语近义词词义辨析：查清每个词的边界、语感与用法差异。" />
<meta name="color-scheme" content="dark light" />
<title>VocabLens 词镜 · 近义词义辨析</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%2338d6c6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='13' cy='16' r='6.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M18 21l5 5' stroke='white' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<!-- ========== 背景：极光渐变 + 噪点 ========== -->
<div class="aurora" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
  <span class="blob blob-4"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<!-- ========== 图标精灵 ========== -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="6.5" width="14" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M7.5 3.5h11a3 3 0 013 3v10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.6 9.4a2.5 2.5 0 114.1 2.1c-.9.7-1.7 1.2-1.7 2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.15" fill="currentColor"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 4.8A1.8 1.8 0 018.3 3h7.4a1.8 1.8 0 011.8 1.8v16l-5.5-3.7-5.5 3.7z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-bookmark-fill" viewBox="0 0 24 24"><path d="M6.5 4.8A1.8 1.8 0 018.3 3h7.4a1.8 1.8 0 011.8 1.8v16l-5.5-3.7-5.5 3.7z" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11l-11 11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5l7 6.5-7 6.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5l-7 6.5 7 6.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9.5l6.5 7 6.5-7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.2 14.4A8.6 8.6 0 019.6 3.8a8.6 8.6 0 1010.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.5 9.5h3.2l4.3-3.6v12.2l-4.3-3.6H4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.4 9a4.2 4.2 0 010 6M18 6.4a7.6 7.6 0 010 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8l4.6 4.4L19 6.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.4L19.3 10l-5.4 1.9L12 17.3l-1.9-5.4L4.7 10l5.4-1.6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M18.5 15.2l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.5-5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 17.5h6M10 21h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M12 3a6 6 0 00-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.4L2.9 20h18.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="17.1" r="1.1" fill="currentColor"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.8 11.4V4.8a1 1 0 011-1h6.6a1 1 0 01.7.3l8.2 8.2a1 1 0 010 1.4l-6.6 6.6a1 1 0 01-1.4 0L4.1 12.1a1 1 0 01-.3-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.3l8.4 4.4-8.4 4.4L3.6 7.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3.6 12.2l8.4 4.4 8.4-4.4M3.6 16.4l8.4 4.4 8.4-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 5.5H4.6v1.6A3 3 0 007.4 10M17 5.5h2.4v1.6A3 3 0 0116.6 10M12 14v3.5M8.5 20.5h7l-.7-3H9.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.3 12.3l2.6 2.5 4.8-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="shell">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar" id="topbar">
    <div class="topbar-grid" id="topbarGrid">
      <a class="brand" href="#" aria-label="VocabLens 词镜 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#38d6c6"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#bg1)"/><circle cx="13" cy="16" r="6.4" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M18 21l5 5" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-text">
          <strong>VocabLens</strong>
          <small>词镜 · 看清楚每个词的边界</small>
        </span>
      </a>

      <div class="search-field" id="searchField" role="search">
        <svg class="ic search-ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜索英文词、中文释义或语义分类" aria-label="搜索词组" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="清空搜索" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="topbar-actions">
        <div class="stat-pill" id="topStats" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-trophy"/></svg>
          <span>今日 <b id="statToday">0</b> 组</span>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题">
          <svg class="ic ic-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="ic ic-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>

      <div class="chip-row" id="categoryChips" role="tablist" aria-label="语义分类筛选"></div>
    </div>
  </header>

  <!-- ========== 侧栏（桌面） ========== -->
  <aside class="sidebar" id="sidebar">
    <nav class="side-nav" aria-label="主导航">
      <button class="side-item" data-view="search" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>搜索辨析</span>
      </button>
      <button class="side-item" data-view="browse" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span>分类浏览</span>
      </button>
      <button class="side-item" data-view="study" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-cards"/></svg><span>学习卡片</span>
      </button>
      <button class="side-item" data-view="quiz" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-quiz"/></svg><span>随堂测验</span>
      </button>
      <button class="side-item" data-view="favorites" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg><span>我的收藏</span>
        <em class="side-badge" id="favBadge" hidden>0</em>
      </button>
    </nav>
    <div class="side-foot">
      <p class="side-note">共 <b id="sideGroupCount">0</b> 组词义辨析 · <b id="sideWordCount">0</b> 个词条</p>
      <p class="side-hint">按 <kbd>/</kbd> 快速搜索 · <kbd>?</kbd> 查看帮助</p>
    </div>
  </aside>

  <!-- ========== 主内容 ========== -->
  <main class="content" id="content" tabindex="-1"></main>

  <!-- ========== 底部导航（移动端） ========== -->
  <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
    <button class="tab-item" data-view="search" type="button">
      <span class="tab-ic"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span><span class="tab-label">搜索</span>
    </button>
    <button class="tab-item" data-view="browse" type="button">
      <span class="tab-ic"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg></span><span class="tab-label">浏览</span>
    </button>
    <button class="tab-item" data-view="study" type="button">
      <span class="tab-ic"><svg class="ic" aria-hidden="true"><use href="#i-cards"/></svg></span><span class="tab-label">学习</span>
    </button>
    <button class="tab-item" data-view="quiz" type="button">
      <span class="tab-ic"><svg class="ic" aria-hidden="true"><use href="#i-quiz"/></svg></span><span class="tab-label">测验</span>
    </button>
    <button class="tab-item" data-view="favorites" type="button">
      <span class="tab-ic"><svg class="ic" aria-hidden="true"><use href="#i-bookmark"/></svg><em class="dot" id="favDot" hidden></em></span><span class="tab-label">收藏</span>
    </button>
  </nav>
</div>

<!-- ========== 详情面板（移动端底部抽屉 / 桌面居中弹窗） ========== -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grab" aria-hidden="true"><span></span></div>
  <div class="sheet-head">
    <div class="sheet-head-text">
      <p class="sheet-cat" id="sheetCat"></p>
      <h2 id="sheetTitle"></h2>
      <div class="sheet-tags" id="sheetTags"></div>
    </div>
    <button class="icon-btn sheet-close" id="sheetClose" type="button" aria-label="关闭">
      <svg class="ic" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot" id="sheetFoot"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/groups.js"></script>
<script src="app.js"></script>

</body>
</html>
